[project]
name = "codecite"
version = "0.1.0"
description = "Bring-your-own-corpus building-code retrieval: section-faithful RAG + MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pymupdf>=1.24",
    "selectolax>=0.3",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "einops>=0.8"]

[project.scripts]
codecite = "codecite.cli:app"

[dependency-groups]
dev = [
    "pillow>=10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codecite"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM117", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
